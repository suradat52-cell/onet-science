<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ติว O-NET วิทยาศาสตร์ ป.6 · ม.3</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#16302b;--mute:#5d736d;--line:#d9e3df;--pri:#0f766e;--pri2:#e0f2ef;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Sarabun,system-ui,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:1.15rem}
header small{opacity:.85}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:1.1rem;margin:0 0 10px}
h3{font-size:1rem;margin:14px 0 6px}
button,select,input,textarea{font:inherit}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost{background:var(--pri2);color:var(--pri)}
button.link{background:none;color:var(--pri);padding:4px 6px;text-decoration:underline}
button.danger{background:#fee2e2;color:var(--bad);padding:4px 10px}
select,input,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:120px}
label{display:block;font-weight:600;margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}
.row>button{flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid button{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left}
.grid button:hover{border-color:var(--pri)}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:99px;padding:1px 10px;font-size:.82rem;font-weight:600;margin-right:4px}
.tag.y{background:#fef3c7;color:var(--warn)}
.mute{color:var(--mute);font-size:.9rem}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
.q{border-top:1px solid var(--line);padding:14px 0}
.q:first-of-type{border-top:0}
.q img{max-width:100%;border-radius:8px;margin:6px 0}
.q img.subimg{max-width:min(100%,420px);margin:0}
.q label{font-weight:400;margin:4px 0;display:flex;gap:8px;align-items:flex-start}
.q input[type=radio]{width:auto;margin-top:6px}
.stem{white-space:pre-wrap}
.tag.off{background:#fee2e2;color:var(--bad)}
.tag.out{background:#fef3c7;color:#92400e}
.yn{display:inline-flex!important;position:relative;margin:2px 6px 2px 0!important;cursor:pointer}
.yn input{position:absolute;opacity:0;width:1px;height:1px}
.yn span{display:inline-block;min-width:3.2em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:4px 12px;font-weight:600;background:#fff}
.yn input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff}
.yn input:focus-visible+span{outline:3px solid var(--pri2);outline-offset:1px}
.pick{margin-top:4px}
table.cx td,table.cx th{border:1px solid var(--line)}
table.cx td.c{text-align:center;white-space:nowrap;width:1%}
.ord label{display:flex;align-items:center;gap:8px}
.ord select{max-width:280px}
.ok-c{color:var(--ok);font-weight:700}.bad-c{color:var(--bad);font-weight:700}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:.92rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
a{color:var(--pri)}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#16302b;color:#fff;padding:8px 16px;border-radius:99px;display:none;max-width:90vw}

body.lv-P6{--pri:#c2410c;--pri2:#ffedd5;font-size:17.5px}
#lvb{display:inline-block;background:#fff;color:var(--pri);border-radius:99px;padding:0 12px;font-weight:700;margin-left:8px}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;background:#fff;border:2px solid var(--line);color:var(--ink);font-weight:700;padding:12px}
.seg button.lvb-P6.on{background:#c2410c;border-color:#c2410c;color:#fff}
.seg button.lvb-M3.on{background:#0f766e;border-color:#0f766e;color:#fff}
.rich h3{border-left:5px solid var(--pri);padding-left:10px;margin-top:20px;font-size:1.08rem}
.rich ul{margin:6px 0;padding-left:22px}
.rich li{margin:3px 0}
.box{border-radius:10px;padding:10px 14px;margin:10px 0;break-inside:avoid}
.box b.t{display:block;font-size:.85rem}
.box.key{background:#fef9c3;border:1px solid #fde047}
.box.tip{background:#fee2e2;border:1px solid #fca5a5}
.box.ex{background:#e0f2fe;border:1px solid #7dd3fc}
.box.warn{background:#ffedd5;border:2px solid #f97316}
.sol{display:none;border-left:4px solid var(--pri);padding:4px 14px 10px;margin:8px 0;background:#fbfbf8;border-radius:0 10px 10px 0}.sol.open{display:block}.sol h3.solh{margin-top:8px}.sol .lnk{font-size:.92rem}
.eq{text-align:center;font-size:1.15em;font-weight:600;margin:12px 0;break-inside:avoid}
.eq .e{display:inline-block;margin:4px 20px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .25em;line-height:1.25}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .35em}
.fr>span:last-child{padding:0 .35em}
figure{margin:12px auto;max-width:460px;text-align:center;break-inside:avoid;page-break-inside:avoid}
figure svg{width:100%;height:auto;font:11px Sarabun,sans-serif;fill:currentColor}
figure img{max-width:100%}
figcaption{font-size:.88rem;color:var(--mute)}
.rich table{margin:8px 0}
.rich tr:first-child td{font-weight:700;background:var(--pri2)}
.sheet1{border:2px solid var(--pri);border-radius:10px;padding:2px 12px 8px;margin:10px 0 18px}
.sheet1 .box{margin:5px 0}
@media print{
  .sheet1{break-after:page;page-break-after:always;font-size:9.6pt;line-height:1.28;padding:0 8px 4px;margin:4px 0 0}
  .sheet1 h3{margin:3px 0 2px;font-size:10pt;padding-left:6px;border-left-width:4px}.sheet1 table{font-size:8.6pt}.sheet1 th,.sheet1 td{padding:1px 4px}.sheet1 .box{font-size:8.8pt}.sheet1 .box b.t{display:inline;margin-right:5px;font-size:8.4pt}.sheet1 .rich table{margin:4px 0}.sheet1 .box{margin:3px 0;padding:3px 7px}.sheet1 .rich ul,.sheet1 .rich p{margin:2px 0}
}
@media print{
  body{background:#fff;font-size:12.5pt}
  header{background:none;color:#000;padding:0 0 6px;border-bottom:2px solid #000}
  #lvb{border:1px solid #000;color:#000}
  button,#msg,.noprint{display:none!important}
  main{max-width:none;padding:8px 0}
  .card{border:0;padding:0}
  .q{break-inside:auto}
  .q img{display:block;max-width:100%;max-height:235mm;width:auto;height:auto;break-inside:avoid;page-break-inside:avoid}
  .stem,table.cx tr,.q label,.ord label{break-inside:avoid}
  .q>div:first-child,.stem{break-after:avoid;page-break-after:avoid}
  .box,.tag,.yn span,.rich tr:first-child td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rich .scroll,.rich table,.rich tr,.rich figure,.eq,.box{break-inside:avoid;page-break-inside:avoid}
  h3,.rich h3{break-after:avoid;page-break-after:avoid}
  .card>table{break-inside:avoid;page-break-inside:avoid}
  .rich ul{break-before:avoid}
}
</style>
</head>
<body>
<header><h1>ติว O-NET วิทยาศาสตร์<span id="lvb"></span></h1><small>ป.6 และ ม.3 · ข้อสอบจริงจาก สทศ. แยกตามมาตรฐานและตัวชี้วัด</small></header>
<main id="app"></main>
<div id="msg"></div>
<script>
/* ====== ตั้งค่า: วาง URL ของ Apps Script Web app (ลงท้ายด้วย /exec) ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbx6hs29CHXPQGAgLKR8goORieF0l8cSI_9WXuOsblbhCmi5SEejDTF8lvf1ESR-aNxS/exec';

const NIETS = 'https://www.niets.or.th/th/content/uploads/editor/files/O-NET/';
const PAGE = 'https://www.niets.or.th/th/content/view/';
const BLUEPRINT = { P6: NIETS + 'TB_65SciP6%20O_NET69.pdf', M3: NIETS + 'TB_95SciM3%20O_NET69.pdf' };
// ลิงก์ข้อสอบวิทยาศาสตร์พร้อมเฉลยที่ สทศ. เผยแพร่ (ปีการศึกษา)
const EXAMS = [
  { y: 2568, page: 27057, P6: 'exam_p6_2568/scienceP6.pdf', M3: 'exam_m3_2568/ScienceM368.pdf' },
  { y: 2567, page: 26522, P6: 'exam_p6_2567/sciP6.pdf', M3: 'exam_m3_2567/sciM3-67.pdf' },
  { y: 2566, page: 26039, P6: 'exam_p6_2566/65 วิทยาศาสตร์ ชุด100 สมบูรณ์.pdf', M3: 'exam_m3_2566/95 Science 100-complete.pdf' },
  { y: 2565, page: 25581, P6: 'exam_p6_2565/วิทยาศาสตร์ ป.6.pdf', M3: 'exam_m3_2565/วิทยาศาสตร์ ม.3.pdf' },
  { y: 2564, page: 25230, P6: 'exam_p6_2564/วิทยาศาสตร์ ป6.pdf', M3: 'exam_m3_2564/95 วิทยาศาตร์.pdf' },
  { y: 2563, page: 22345, P6: 'exam_p6_2563/65 วิชาวิทยาศาสตร์.pdf', M3: 'exam_m3_2563/95 วิชาวิทยาศาสตร์.pdf' },
  { y: 2562, page: 17797, P6: 'exam_p6_2562/ข้อสอบและกระดาษคำตอบวิชา 65 วิทย์ 100.pdf', M3: 'exam_m3_2562/ข้อสอบและกระดาษคำตอบวิชา 95 วิทย์ 100 .pdf' },
  { y: 2561, page: 12793, P6: 'exam_p6_2561/65 วิทยาศาสตร์ 100.pdf', M3: 'exam_m3_2561/95 วิทยาศาสตร์ 100.pdf' },
  { y: 2560, page: 7177 }
];
const LV = { P6: 'ป.6', M3: 'ม.3' };

const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (c, t) => t ? Math.round(c * 100 / t) + '%' : '–';
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let S = store.get('onet') || {}, Q = null, A = { tab: 'students', level: 'P6' };
const save = () => store.set('onet', { code: S.code, school: S.school, room: S.room, level: S.level, student: S.student, token: S.token });

function toast(t) { const m = $('#msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', 3500); }
async function api(action, data) {
  if (!API_URL) throw new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html');
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, data || {})) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function run(fn) { try { await fn(); theme(); } catch (e) { toast(e.message); if (/เข้าสู่ระบบใหม่/.test(e.message)) { S.token = null; save(); admin(); } else if (/รหัสห้องเรียนไม่ถูกต้อง/.test(e.message) && S.code) { S.code = S.student = null; save(); home(); } } }
const loading = t => app.innerHTML = '<div class="card mute">' + esc(t || 'กำลังโหลด…') + '</div>';
const nav = () => '<p class="row"><button class="link" data-a="home">หน้าแรก</button><button class="link" data-a="res">ผังข้อสอบและข้อสอบจาก สทศ.</button><button class="link" data-a="admin">สำหรับครู/แอดมิน</button></p>';

/* ---------- ธีมตามระดับชั้น ---------- */
function theme() { document.body.className = 'lv-' + (S.level || 'P6'); $('#lvb').textContent = 'ระดับ ' + LV[S.level || 'P6']; }

/* ---------- ภาพประกอบในตัว (SVG) ใช้ในสรุปด้วย [[fig:ชื่อ|คำบรรยาย]] ---------- */
const W = 'fill="none" stroke="currentColor" stroke-width="2"';
const lamp = (x, y) => `<circle cx="${x}" cy="${y}" r="12" fill="#fff" stroke="currentColor" stroke-width="2"/><path d="M${x - 8} ${y - 8}l16 16M${x + 8} ${y - 8}l-16 16" ${W}/>`;
const batt = '<rect x="30" y="69" width="20" height="12" fill="#fff" stroke="none"/><path d="M26 68H54" ' + W + '/><path d="M33 82H47" fill="none" stroke="currentColor" stroke-width="5"/><text x="12" y="72">+</text><text x="12" y="88">–</text><text x="58" y="79">ถ่านไฟฉาย</text>';
const FIG = {
  series: '<svg viewBox="0 0 260 150" role="img" aria-label="วงจรอนุกรม"><path d="M40 30H220V120H40Z" ' + W + '/>' + batt + lamp(105, 30) + lamp(175, 30) +
    '<text x="105" y="58" text-anchor="middle">หลอด 1</text><text x="175" y="58" text-anchor="middle">หลอด 2</text><polygon points="136,114 124,120 136,126"/><text x="130" y="140" text-anchor="middle">ทิศกระแสไฟฟ้า (ทางเดียว)</text></svg>',
  parallel: '<svg viewBox="0 0 260 150" role="img" aria-label="วงจรขนาน"><path d="M40 20H220V125H40Z" ' + W + '/><path d="M130 20V125" ' + W + '/>' + batt + lamp(130, 75) + lamp(220, 75) +
    '<text x="146" y="52">หลอด 1</text><text x="204" y="104" text-anchor="end">หลอด 2</text><polygon points="91,119 79,125 91,131"/><text x="130" y="144" text-anchor="middle">กระแสไฟฟ้าแยกไหล 2 ทาง</text></svg>'
};

/* ---------- แปลงข้อความสรุปเป็นหน้าติว: ## หัวข้อ, • รายการ, !! จำให้แม่น, ?? ข้อสอบชอบถาม, ex: ตัวอย่าง, = สมการ, {เศษ/ส่วน}, | ตาราง | ---------- */
function inl(s) {
  return esc(s).replace(/\{([^{}\/]+)\/([^{}\/]+)\}/g, '<span class="fr"><span>$1</span><span>$2</span></span>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
/* ภาพ SVG ของสรุปแต่ละระดับอยู่ในไฟล์ figs/P6.js และ figs/M3.js (แยกกันเด็ดขาด) โหลดเมื่อเปิดหน้าสรุปของระดับนั้น */
const FIGS = { P6: {}, M3: {} };
const figLoaded = {};
function loadFigs(lv) {
  if (!figLoaded[lv]) figLoaded[lv] = new Promise(ok => { const s = document.createElement('script'); s.src = 'figs/' + lv + '.js'; s.onload = s.onerror = () => ok(); document.head.appendChild(s); });
  return figLoaded[lv];
}
const figOf = n => FIG[n] || (FIGS[S.level || 'P6'] || {})[n];
function rich(t) {
  let h = '', ul = false, tb = false, box = '';
  const close = () => { if (ul) { h += '</ul>'; ul = false; } if (tb) { h += '</table></div>'; tb = false; } if (box) { h += '</div>'; box = ''; } };
  // บรรทัดติดกันที่ขึ้นต้นเหมือนกัน (ex: / !! / ??) รวมเป็นกล่องเดียว
  const boxLine = (kind, cls, title, text) => { if (box !== kind) { close(); box = kind; h += '<div class="box ' + cls + '"><b class="t">' + title + '</b>'; } else h += '<br>'; h += inl(text); };
  String(t).split(/\r?\n/).forEach(raw => {
    const l = raw.trim(); let m;
    if (!l) return close();
    if (l.startsWith('!! ')) return boxLine('!!', 'key', 'จำให้แม่น', l.slice(3));
    if (l.startsWith('?? ')) return boxLine('??', 'tip', 'ข้อสอบชอบถาม', l.slice(3));
    if (l.startsWith('ex: ')) return boxLine('ex', 'ex', 'ตัวอย่าง', l.slice(4));
    if (l.startsWith('xx: ')) return boxLine('xx', 'tip', 'จุดที่มักพลาด', l.slice(4));
    if (l.startsWith('ob: ')) return boxLine('ob', 'warn', 'ข้อสังเกต (ควรตรวจกับครู)', l.slice(4));
    if (/^[•\-] /.test(l)) { if (tb || box) close(); if (!ul) { h += '<ul>'; ul = true; } h += '<li>' + inl(l.slice(2)) + '</li>'; return; }
    if (l[0] === '|') { if (ul || box) close(); if (!tb) { h += '<div class="scroll"><table>'; tb = true; } h += '<tr>' + l.replace(/^\||\|$/g, '').split('|').map(c => '<td>' + inl(c.trim()) + '</td>').join('') + '</tr>'; return; }
    close();
    if ((m = l.match(/^>> ([^|]+)\|([^|]*)\|(.+)$/))) { h += '<p class="lnk">อ่านต่อในสรุปเนื้อหา: <a target="_blank" rel="noopener" href="?sum=' + encodeURIComponent(m[1].trim() + '|' + m[2].trim() + '|' + m[3].trim()) + '">' + esc(m[1].trim()) + (m[2].trim() ? ' · ' + esc(m[2].trim()) : '') + ' · ' + esc(m[3].trim()) + '</a></p>'; return; }
    if (l.startsWith('## ')) h += '<h3>' + inl(l.slice(3)) + '</h3>';
    else if (l.startsWith('= ')) h += '<div class="eq">' + l.slice(2).split(/\s{2,}/).map(x => '<span class="e">' + inl(x) + '</span>').join('') + '</div>';
    else if ((m = l.match(/^\[\[fig:([\w-]+)(?:\|(.*))?\]\]$/)) && figOf(m[1])) h += '<figure>' + figOf(m[1]) + (m[2] ? '<figcaption>' + inl(m[2]) + '</figcaption>' : '') + '</figure>';
    else if ((m = l.match(/^\[\[img:(https:\/\/[^|\]\s]+)(?:\|(.*))?\]\]$/))) h += '<figure><img src="' + esc(m[1]) + '" alt="' + esc(m[2] || 'ภาพประกอบ') + '">' + (m[2] ? '<figcaption>' + inl(m[2]) + '</figcaption>' : '') + '</figure>';
    else h += '<p>' + inl(l) + '</p>';
  });
  close(); return h;
}

/* ---------- หน้าแรก: กรอกรหัสห้องเรียน แล้วเลือกชื่อ (ไม่แสดงรายชื่อโรงเรียนแบบเปิด) ---------- */
function codeForm() {
  app.innerHTML = '<div class="card"><h2>เข้าห้องเรียน</h2><p class="mute">ขอรหัสห้องเรียน 6 ตัวอักษรจากครู แล้วกรอกด้านล่าง (เครื่องนี้จะจำรหัสไว้ ไม่ต้องกรอกซ้ำ)</p>' +
    '<form id="cf"><div class="row"><input id="cc" name="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="เช่น K7M2XQ" style="text-transform:uppercase;letter-spacing:.2em;font-size:1.4em;max-width:12em" required><button>เข้าห้อง</button></div></form></div>' + nav();
  $('#cf').onsubmit = e => { e.preventDefault(); run(async () => {
    const code = $('#cc').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    const r = await api('joinRoom', { code });
    S.code = code; S.school = r.school; S.room = r.room; S.level = r.level; S.student = null; save(); await home();
  }); };
}
async function home() {
  if (!API_URL) { app.innerHTML = '<div class="card note">ยังไม่ได้เชื่อมต่อฐานข้อมูล: ใส่ URL ของ Apps Script ในตัวแปร <b>API_URL</b> ที่ไฟล์ index.html (ดู README)</div>' + nav(); return; }
  if (!S.code) { S.level = S.level || 'P6'; return codeForm(); }
  loading();
  const list = await api('listStudents', { code: S.code });

/* ---------- ทำข้อสอบ ---------- */
// __ข้อความ__ = ขีดเส้นใต้ตามต้นฉบับ
const fmt = s => esc(s).replace(/__(.+?)__/g, '<u>$1</u>');
const plain = s => String(s == null ? '' : s).replace(/__/g, '');
// ลิงก์รูป: https://… ใช้ตามนั้น · ชื่อไฟล์ (เช่น P6-2568-07.png) แสดงจากโฟลเดอร์ images/ ของเว็บ
const imgSrc = u => { u = String(u || '').trim(); return /^https:\/\//.test(u) ? u : /^[\w.-]+\.(png|jpe?g|gif|webp|svg)$/i.test(u) ? 'images/' + u : ''; };
// ข้อความย่อยที่เป็นชื่อไฟล์ภาพล้วน (เช่น M3-2567-34-1.png) แสดงเป็นภาพที่แคปจากต้นฉบับ
const cell = c => /^[\w.-]+\.(png|jpe?g|gif|webp)$/i.test(String(c).trim()) ? '<img class="subimg" src="' + esc(imgSrc(c)) + '" alt="ข้อย่อย">' : fmt(c);
const sub = (q, i, k) => (q.itemNo || i + 1) + '.' + (k + 1);
const parts = v => String(v || '').split(',');
const nYN = ['ใช่', 'ไม่ใช่'];
function qHead(q, i) {
  const src = imgSrc(q.imageUrl);
  return '<div><span class="tag y">O-NET ปีการศึกษา ' + esc(q.examYear) + (q.itemNo ? ' ข้อ ' + esc(q.itemNo) : '') + '</span><span class="tag">' + esc(q.standard) + (q.indicator ? ' · ' + esc(q.indicator) : '') + '</span>' +
    (q.offPlan ? '<span class="tag off">ไม่อยู่ในผัง ' + esc(q.offPlan) + '</span>' : '') + (q.outCurr ? '<span class="tag out">นอกหลักสูตรปัจจุบัน</span>' : '') + '</div><div class="stem"><b>' + (i + 1) + '.</b> ' + fmt(q.stem) + '</div>' +
    (src ? '<img src="' + esc(src) + '" alt="ภาพประกอบข้อ ' + (i + 1) + '">' : '');
}
function qInput(q, i) {
  const n = esc(q.id), yn = (name, v) => '<label class="yn"><input type="radio" name="' + name + '" value="' + v + '"><span>' + v + '</span></label>';
  if (q.type === 'complex') return '<div class="scroll"><table class="cx"><tr><th>ข้อ</th><th>ข้อความ</th><th>ใช่ หรือ ไม่ใช่</th></tr>' +
    q.choices.map((c, k) => '<tr><td>' + sub(q, i, k) + '</td><td>' + cell(c) + '</td><td class="c">' + nYN.map(v => yn(n + '__' + k, v)).join('') + '</td></tr>').join('') + '</table></div>';
  if (q.type === 'order') return '<div class="ord">' + Array.from({ length: q.slots }, (_, k) => '<label>' + sub(q, i, k) + ' <select name="' + n + '__' + k + '"><option value="">— เลือก —</option>' +
    q.choices.map((c, j) => '<option value="' + (j + 1) + '">' + (j + 1) + ' ' + esc(plain(c)) + '</option>').join('') + '</select></label>').join('') + '</div>';
  if (q.type === 'fill') return '<input name="' + n + '" placeholder="พิมพ์คำตอบ" autocomplete="off">';
  if (!q.choices.length) return '<div class="pick"><span class="mute">เลือกคำตอบ </span>' + [1, 2, 3, 4].map(v => yn(n, v)).join('') + '</div>'; // ตัวเลือกอยู่ในภาพ
  return q.choices.map((c, j) => '<label><input type="radio" name="' + n + '" value="' + (j + 1) + '"> <span>' + (j + 1) + ') ' + fmt(c) + '</span></label>').join('');
}
function answerOf(fd, q) {
  if (q.type === 'complex') return q.choices.map((_, k) => fd.get(q.id + '__' + k) || '').join(',');
  if (q.type === 'order') return Array.from({ length: q.slots }, (_, k) => fd.get(q.id + '__' + k) || '').join(',');
  return String(fd.get(q.id) || '').trim();
}
const answered = (q, v) => q.type === 'complex' || q.type === 'order' ? parts(v).every(Boolean) : !!v;
async function quiz(mode, std, ind, skip) {
  loading('กำลังเตรียมข้อสอบ…');
  const qs = await api('getQuiz', { level: S.level, mode, standard: std, year: std, indicator: ind, skip: skip || 0 });
  if (!qs.length) { toast(skip ? 'ทำครบทุกข้อในหัวข้อนี้แล้ว' : 'ยังไม่มีข้อสอบในหัวข้อนี้'); return dash(); }
  Q = { mode, std, ind, skip: skip || 0, qs };
  const full = qs.reduce((n, q) => n + (+q.points || 0), 0);
  app.innerHTML = '<div class="card"><h2>' + (mode === 'mock' ? 'ข้อสอบจำลองตาม Test Blueprint' : mode === 'year' ? 'ข้อสอบ O-NET ปีการศึกษา ' + esc(std) : 'ฝึกมาตรฐาน ' + esc(std) + (ind ? ' · ' + esc(ind) : '')) + ' <span class="mute">(' + qs.length + ' ข้อ' + (mode === 'year' ? '' : ' ' + Math.round(full * 100) / 100 + ' คะแนน เรียงจากปีล่าสุด') + ')</span></h2><form id="f">' +
    qs.map((q, i) => '<div class="q">' + qHead(q, i) + qInput(q, i) + '</div>').join('') +
    '<div class="row"><button>ส่งคำตอบ</button><button type="button" class="ghost" data-a="pdf">ดาวน์โหลดข้อสอบ PDF</button><button type="button" class="ghost" data-a="dash">ยกเลิก</button></div></form></div>';
  $('#f').onsubmit = e => { e.preventDefault(); run(submit); };
}
function showAns(q, v) {
  if (!v) return '–';
  if (q.type === 'order') return parts(v).map(x => x ? esc(x) + (q.choices[x - 1] ? ' ' + fmt(q.choices[x - 1]) : '') : '–').join(' → ');
  if (q.type === 'mc') return String(v).split('|').map(n => q.choices[n - 1] ? esc(n) + ') ' + fmt(q.choices[n - 1]) : 'ข้อ ' + esc(n)).join(' <i>หรือ</i> ');
  return esc(v);
}
function review(q, i, x) {
  if (q.type === 'complex') {
    const y = parts(x.yours), a = parts(x.answer);
    return '<div class="scroll"><table class="cx"><tr><th>ข้อ</th><th>ข้อความ</th><th>ตอบ</th><th>เฉลย</th><th></th></tr>' + q.choices.map((c, k) =>
      '<tr><td>' + sub(q, i, k) + '</td><td>' + cell(c) + '</td><td class="c">' + esc(y[k] || '–') + '</td><td class="c"><b>' + esc(String(a[k]).split('|').join(' หรือ ')) + '</b></td><td class="c ' + (String(a[k]).split('|').includes(y[k]) ? 'ok-c">✓' : 'bad-c">✗') + '</td></tr>').join('') + '</table></div>';
  }
  return (x.ok ? '' : '<div>ตอบ: ' + showAns(q, x.yours) + '</div><div>เฉลย: <b>' + showAns(q, x.answer) + '</b></div>');
}
const solBlock = (s, i) => s ? '<p class="row noprint"><button type="button" class="ghost" data-a="sol" data-k="' + i + '">ดูเฉลยละเอียด</button></p><div class="sol" id="sol-' + i + '"><h3 class="solh">เฉลยละเอียด · ' + esc(s.title) + '</h3><div class="rich">' + rich(s.content) + '</div></div>' : '';
async function submit() {
  const fd = new FormData($('#f')), answers = {};
  Q.qs.forEach(q => answers[q.id] = answerOf(fd, q));
  const left = Q.qs.filter(q => !answered(q, answers[q.id])).length;
  if (left && !confirm('ยังตอบไม่ครบ ' + left + ' ข้อ (ข้อเชิงซ้อน/เรียงลำดับต้องตอบทุกข้อย่อย) ส่งคำตอบเลยหรือไม่?')) return;
  loading('กำลังตรวจคำตอบ…');
  const r = await api('submit', { code: S.code, studentId: S.student.id, mode: Q.mode, standard: Q.std || '', ids: Q.qs.map(q => q.id), answers });
  const by = {}; r.items.forEach(i => by[i.id] = i);
  let sols = {}; try { sols = await api('solutions', { level: S.level, keys: Q.qs.map(q => q.examYear + '/' + q.itemNo) }); } catch (e) { sols = {}; }
  app.innerHTML = '<div class="card"><h2>' + (Q.mode === 'year' ? 'ได้ ' + pct(r.score, r.maxScore) : 'ได้ ' + r.score + ' / ' + r.maxScore + ' คะแนน (' + pct(r.score, r.maxScore) + ')') + ' <span class="mute">ถูก ' + r.correct + ' จาก ' + r.total + ' ข้อ</span></h2>' +
    '<p class="mute">ข้อเชิงซ้อนให้คะแนนบางส่วนตามเกณฑ์ในคำชี้แจงของข้อสอบแต่ละฉบับ · ข้อเรียงลำดับได้คะแนนเมื่อถูกทุกลำดับ</p>' +
    Q.qs.map((q, i) => { const x = by[q.id] || {};
      return '<div class="q">' + qHead(q, i) + '<div class="' + (x.ok ? 'ok' : 'bad') + '">' + (x.ok ? '✓ ถูก' : x.earned > 0 ? '◐ ถูกบางส่วน' : '✗ ' + (x.yours ? 'ผิด' : 'ไม่ได้ตอบ')) + '' + (Q.mode === 'year' ? '' : ' <span class="mute">(' + (x.earned || 0) + '/' + (x.points || 0) + ' คะแนน)</span>') + '</div>' +
        review(q, i, x) + (x.explanation ? '<div class="mute">' + fmt(x.explanation) + '</div>' : '') + solBlock(sols[q.examYear + '/' + q.itemNo], i) + '</div>'; }).join('') +
    '<div class="row">' + (Q.mode === 'practice' ? '<button data-a="next">ชุดถัดไป</button>' : '') + '<button class="ghost" data-a="pdf">ดาวน์โหลดเฉลย PDF</button><button class="ghost" data-a="dash">กลับหน้าสรุป</button></div></div>';
  window.scrollTo(0, 0);
}

    const st = A.school ? await api('students', { token: S.token, schoolId: A.school, level: A.level }) : [];
    const rc = A.school ? await api('roomCodes', { token: S.token, schoolId: A.school, level: A.level }) : [];
    body = pick + '<h3>รหัสห้องเรียน (ให้นักเรียนกรอกเพื่อเห็นรายชื่อห้องตัวเอง)</h3>' + (rc.length ? '<table><tr><th>ห้อง</th><th>รหัส</th><th class="n">นักเรียน</th><th></th></tr>' + rc.map(x => '<tr><td>' + esc(x.room) + '</td><td><b style="letter-spacing:.15em;font-size:1.2em">' + esc(x.code) + '</b></td><td class="n">' + x.count + '</td><td class="n noprint"><button class="ghost" data-a="rcreset" data-code="' + esc(x.code) + '">สร้างรหัสใหม่</button></td></tr>').join('') + '</table>' : '<p class="mute">ยังไม่มีห้อง: เพิ่มรายชื่อนักเรียนด้านล่าง ระบบจะสร้างรหัสให้ทุกห้องอัตโนมัติ</p>') + '<label>เพิ่มรายชื่อ (บรรทัดละคน: ห้อง,เลขที่,ชื่อ-สกุล หรือวางจาก Excel)</label><textarea id="st" placeholder="6/1,1,เด็กชายตัวอย่าง ใจดี"></textarea><p><button data-a="addst">เพิ่มนักเรียน</button></p>' +
      '<h3>รายชื่อ ' + st.length + ' คน</h3><div class="scroll"><table>' + st.map(s => '<tr><td>' + esc(s.room) + '</td><td>' + esc(s.no) + '</td><td>' + esc(s.name) + '</td><td class="n"><button class="danger" data-a="delst" data-id="' + esc(s.id) + '">ลบ</button></td></tr>').join('') + '</table></div>';
  } else if (A.tab === 'report') {
    const r = A.school ? await api('report', { token: S.token, schoolId: A.school, level: A.level }) : { students: [], standards: [] };
    body = pick + '<h3>ผลรวมตามมาตรฐาน</h3><table><tr><th>มาตรฐาน</th><th class="n">ทำ (ข้อ)</th><th class="n">ถูก</th></tr>' + r.standards.map(x => '<tr><td>' + esc(x.standard) + '</td><td class="n">' + x.total + '</td><td class="n">' + pct(x.correct, x.total) + '</td></tr>').join('') + '</table>' +
      '<h3>รายบุคคล</h3><div class="scroll"><table><tr><th>ห้อง</th><th>เลขที่</th><th>ชื่อ</th><th class="n">ครั้ง</th><th class="n">ถูก/ทำ</th><th class="n">%</th><th>ล่าสุด</th></tr>' + r.students.map(s => '<tr><td>' + esc(s.room) + '</td><td>' + esc(s.no) + '</td><td>' + esc(s.name) + '</td><td class="n">' + s.n + '</td><td class="n">' + s.correct + '/' + s.total + '</td><td class="n">' + pct(s.correct, s.total) + '</td><td>' + (s.last ? esc(new Date(s.last).toLocaleDateString('th-TH')) : '–') + '</td></tr>').join('') + '</table></div>';
  } else if (A.tab === 'admins') {
    body = '<table>' + d.admins.map(x => '<tr><td>' + esc(x.username) + '</td><td>' + esc(x.name) + '</td><td>' + (x.role === 'super' ? 'ผู้ดูแลกลาง' : esc(sName(x.schoolId))) + '</td><td class="n">' + (x.id === d.me.id ? '' : '<button class="danger" data-a="delad" data-id="' + esc(x.id) + '">ลบ</button>') + '</td></tr>').join('') + '</table>' +
      '<h3>เพิ่มแอดมิน</h3><form id="ad"><div class="row"><input name="username" placeholder="ชื่อผู้ใช้" required><input name="name" placeholder="ชื่อ-สกุล"><input name="password" type="password" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" required autocomplete="new-password"></div>' +
      (sup ? '<div class="row"><select name="role"><option value="school">แอดมินโรงเรียน</option><option value="super">ผู้ดูแลกลาง</option></select><select name="schoolId">' + d.schools.map(s => '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>').join('') + '</select></div>' : '') + '<p><button>เพิ่มแอดมิน</button></p></form>';
  } else if (A.tab === 'schools') {
    body = '<table>' + d.schools.map(s => '<tr><td>' + esc(s.name) + '</td></tr>').join('') + '</table><form id="sc"><div class="row"><input name="name" placeholder="ชื่อโรงเรียนใหม่" required><button>เพิ่มโรงเรียน</button></div></form><p class="mute">เพิ่มโรงเรียนแล้วไปที่แท็บ "แอดมิน" เพื่อสร้างบัญชีแอดมินของโรงเรียนนั้น</p>';
  } else if (A.tab === 'bp') {
    const b = await api('blueprintStats', { token: S.token });
    body = '<table><tr><th>ระดับ</th><th>ปีการศึกษา</th><th class="n">มาตรฐาน</th><th class="n">ตัวชี้วัด</th><th class="n">จำนวนข้อ</th></tr>' + b.map(x => '<tr><td>' + esc(LV[x.level] || x.level) + '</td><td>' + esc(x.year) + '</td><td class="n">' + x.standards + '</td><td class="n">' + x.indicators + '</td><td class="n">' + x.items + '</td></tr>').join('') + '</table>' +
      '<label>นำเข้าผังข้อสอบ (Test Blueprint)</label><p class="mute">เลือกไฟล์ <b>data/blueprint.tsv</b> หรือวางข้อมูล 9 คอลัมน์: level · year · strand · standard · indicator · description · items · format · points — ผังเดิมของระดับที่อยู่ในไฟล์จะถูกแทนที่ทั้งหมด</p>' +
      fileIn('bpt') + '<textarea id="bpt"></textarea><p><button data-a="impbp">นำเข้าผังข้อสอบ</button></p>';
  } else if (A.tab === 'sol') {
    const b = await api('solutionStats', { token: S.token });
    body = '<table><tr><th>ระดับ</th><th>ปีการศึกษา</th><th class="n">จำนวนข้อ</th></tr>' + b.map(x => '<tr><td>' + esc(LV[x.level] || x.level) + '</td><td>' + esc(x.examYear) + '</td><td class="n">' + x.n + '</td></tr>').join('') + '</table>' +
      '<label>นำเข้าเฉลยละเอียด (เลือกไฟล์ในโฟลเดอร์ import-bundles/ หรือ data/solutions/*.txt ครั้งละไฟล์)</label><p class="mute">แต่ละข้อขึ้นต้นด้วยบรรทัด <b>@@ ระดับ | ปี | ข้อที่ | มาตรฐาน | ตัวชี้วัด | ชื่อหัวข้อ</b> · เฉลยเดิมของข้อที่อยู่ในไฟล์จะถูกแทนที่ ข้ออื่นคงไว้ (นำเข้าซ้ำได้)</p>' +
      fileIn('slt') + '<textarea id="slt"></textarea><p><button data-a="impsol">นำเข้าเฉลยละเอียด</button></p>';
  } else if (A.tab === 'sm') {
    const b = await api('summaryStats', { token: S.token });
    body = '<table><tr><th>ระดับ</th><th>มาตรฐาน</th><th class="n">หัวข้อ</th><th class="n">ตัวอักษร</th></tr>' + b.map(x => '<tr><td>' + esc(LV[x.level] || x.level) + '</td><td>' + esc(x.standard) + '</td><td class="n">' + x.sections + '</td><td class="n">' + x.chars + '</td></tr>').join('') + '</table>' +
      '<label>นำเข้าสรุปเนื้อหา (เลือกไฟล์ data/summaries/*.txt ได้ครั้งละไฟล์)</label><p class="mute">แต่ละหัวข้อขึ้นต้นด้วยบรรทัด <b>@@ ระดับ | มาตรฐาน | ตัวชี้วัด | ชื่อหัวข้อ</b> · สรุปเดิมของมาตรฐาน (ระดับ+มาตรฐาน) ที่อยู่ในไฟล์จะถูกแทนที่ทั้งหมด มาตรฐานอื่นคงไว้ · ภาพ SVG อยู่ในโฟลเดอร์ figs/ ต้องอัปโหลดพร้อม index.html</p>' +
      fileIn('smt') + '<textarea id="smt"></textarea><p><button data-a="impsm">นำเข้าสรุปเนื้อหา</button></p>';
  } else {
    const b = await api('bankStats', { token: S.token });
    body = '<table><tr><th>ระดับ</th><th>ปีการศึกษา</th><th class="n">จำนวนข้อ</th></tr>' + b.map(x => '<tr><td>' + esc(LV[x.level] || x.level) + '</td><td>' + esc(x.examYear) + '</td><td class="n">' + x.n + '</td></tr>').join('') + '</table>' +
      '<label>นำเข้าข้อสอบ (เลือกไฟล์ data/questions-*.tsv หรือวางจาก Google Sheets/Excel 11 คอลัมน์)</label><p class="mute">level(P6/M3) · ปีการศึกษา · ข้อที่ · มาตรฐาน (เช่น ว 1.1) · ตัวชี้วัด (เช่น ป.6/1) · โจทย์ · ลิงก์รูป (ชื่อไฟล์ในโฟลเดอร์ images/ หรือ https) · ตัวเลือก/ข้อความย่อยคั่นด้วย || · เฉลย · คำอธิบาย · ชนิด (mc / complex / order / fill)</p>' +
      fileIn('qt') + '<textarea id="qt"></textarea><p><button data-a="impq">นำเข้าข้อสอบ</button></p>';
  }
  app.innerHTML = '<div class="card"><div class="row"><h2>' + esc(d.me.name) + '</h2><button class="ghost" data-a="logout">ออกจากระบบ</button></div><div class="tabs">' + tabs.map(t => '<button data-a="tab" data-t="' + t[0] + '"' + (A.tab === t[0] ? ' class="on"' : '') + '>' + t[1] + '</button>').join('') + '</div>' + body + '</div>' + nav();
  if ($('#as')) $('#as').onchange = e => { A.school = e.target.value; run(admin); };
  if ($('#al')) $('#al').onchange = e => { A.level = e.target.value; run(admin); };
  const form = (id, act) => { if ($(id)) $(id).onsubmit = e => { e.preventDefault(); run(async () => { await api(act, Object.assign({ token: S.token }, Object.fromEntries(new FormData(e.target)))); toast('บันทึกแล้ว'); await admin(); }); }; };
  form('#ad', 'saveAdmin'); form('#sc', 'saveSchool');
  app.querySelectorAll('input[data-into]').forEach(f => f.onchange = async () => { if (f.files[0]) $('#' + f.dataset.into).value = await f.files[0].text(); });
}

/* ---------- ปุ่มทั้งหมด ---------- */
const ACT = {
  home: () => { S.student = null; save(); return home(); },
  dash, res, admin,
  pick: d => { S.student = { id: d.id, name: d.name }; save(); return dash(); },
  room: () => { S.code = S.student = null; save(); return home(); },
  sol: d => { const b = $('#sol-' + d.k), on = b.classList.toggle('open'); document.querySelector('[data-a=sol][data-k="' + d.k + '"]').textContent = on ? 'ซ่อนเฉลยละเอียด' : 'ดูเฉลยละเอียด'; },
  pdf: () => { app.querySelectorAll('.sol').forEach(s => s.classList.add('open')); const h = app.querySelector('h2'); document.title = 'O-NET วิทย์ ' + LV[S.level] + ' - ' + (h ? h.textContent.trim() : ''); window.print(); },
  mock: () => quiz('mock'),
  year: d => quiz('year', d.y),
  study: d => study(d.std, d.ind || ''),
  prac: d => quiz('practice', d.std, d.ind || ''),
  next: () => quiz('practice', Q.std, Q.ind, Q.skip + Q.qs.length),
  tab: d => { A.tab = d.t; return admin(); },
  logout: () => { S.token = null; save(); return admin(); },
  addst: async () => { const r = await api('addStudents', { token: S.token, schoolId: A.school, level: A.level, text: $('#st').value }); toast('เพิ่มแล้ว ' + r.added + ' คน'); await admin(); },
  rcreset: async d => { if (confirm('สร้างรหัสใหม่? รหัสเดิมจะใช้ไม่ได้ทันที นักเรียนต้องกรอกรหัสใหม่')) { const r = await api('resetRoomCode', { token: S.token, code: d.code }); toast('รหัสใหม่: ' + r.code); await admin(); } },
  delst: async d => { if (confirm('ลบนักเรียนคนนี้?')) { await api('removeStudent', { token: S.token, id: d.id }); await admin(); } },
  delad: async d => { if (confirm('ลบแอดมินคนนี้?')) { await api('removeAdmin', { token: S.token, id: d.id }); await admin(); } },
  impq: async () => { const r = await api('importQuestions', { token: S.token, text: $('#qt').value }); toast('นำเข้าแล้ว ' + r.added + ' ข้อ'); await admin(); },
  impsol: async () => { const r = await api('importSolutions', { token: S.token, text: $('#slt').value }); toast('นำเข้าเฉลยละเอียดแล้ว ' + r.added + ' ข้อ'); await admin(); },
  impsm: async () => { const r = await api('importSummaries', { token: S.token, text: $('#smt').value }); toast('นำเข้าสรุปแล้ว ' + r.added + ' หัวข้อ (' + r.standards.join(', ') + ')'); await admin(); },
  impbp: async () => { const r = await api('importBlueprint', { token: S.token, text: $('#bpt').value }); toast('นำเข้าผังแล้ว ' + r.added + ' แถว (' + r.levels.map(l => LV[l] || l).join(', ') + ')'); await admin(); }
};
app.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && ACT[b.dataset.a]) { e.preventDefault(); run(() => ACT[b.dataset.a](b.dataset)); } });
const SUMQ = new URLSearchParams(location.search).get('sum');
run(() => { if (SUMQ && S.level && API_URL) { const [std, ind, hl] = SUMQ.split('|'); return study(std, ind, hl); } return S.student && S.code && API_URL ? dash() : home(); });
</script>
</body>
</html>
